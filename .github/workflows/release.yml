name: Build and publish APK

on:
  push:
    tags: ["v*.*.*"]
  # Publication manuelle : le tag vX.Y.Z est créé par la release sur le commit construit.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (X.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oeil-de-lynx-release.p12"
      - name: Build signed APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Le tag de release est la source de versionName et versionCode.
          APP_VERSION="${TAG#v}" \
          SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/oeil-de-lynx-release.p12" \
          SIGNING_PASSWORD="$SIGNING_PASSWORD" \
          gradle --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Prepare versioned APK
        shell: bash
        run: |
          # L’asset téléchargeable reste un APK dont le nom contient la version.
          VERSION="${TAG#v}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/oeil-de-lynx-${VERSION}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" "release/oeil-de-lynx-${TAG#v}.apk" --title "Œil de Lynx $TAG" --generate-notes

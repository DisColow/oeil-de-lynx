name: Build and publish APK

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oeil-de-lynx-release.p12"
      - name: Build signed APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Le tag de release est la source de versionName et versionCode.
          APP_VERSION="${GITHUB_REF_NAME#v}" \
          SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/oeil-de-lynx-release.p12" \
          SIGNING_PASSWORD="$SIGNING_PASSWORD" \
          gradle --no-daemon assembleRelease
      - name: Prepare versioned APK
        shell: bash
        run: |
          # L’asset téléchargeable reste un APK dont le nom contient la version.
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/oeil-de-lynx-${VERSION}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "release/oeil-de-lynx-${GITHUB_REF_NAME#v}.apk" --title "Œil de Lynx $GITHUB_REF_NAME" --generate-notes
